name: Build solution

on: [push, pull_request, workflow_dispatch]

# Cancel superseded runs on the same ref (e.g. push + pull_request for one commit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            installer: Installer-x64.iss
    uses: ./.github/workflows/_build.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
      installer: ${{ matrix.installer }}
      sign: false
      # Upload installer on push / PR / manual runs so the package is available as an artifact.
      upload_artifact: true
      artifact_name: EverythingToolbar-Installer-${{ matrix.arch }}
