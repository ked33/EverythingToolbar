name: CSharpier check

# Do not run on push; keep PR and manual triggers only.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_formatting:
    runs-on: windows-2025
    name: Check Formatting
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          dotnet tool restore
          dotnet csharpier check .
